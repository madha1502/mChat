server:
  port: 5000
  servlet:
    context-path: /

spring:
  application:
    name: mchat-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  # Default Development Database (Embedded H2 for instant local zero-config running)
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/mchatdb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE}
    driverClassName: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: ${SPRING_JPA_DIALECT:org.hibernate.dialect.H2Dialect}

  h2:
    console:
      enabled: true
      path: /h2-console

  # Redis Cache & Presence Configuration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms

  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASS:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

socketio:
  host: 0.0.0.0
  port: 5001

app:
  jwt:
    secret: ${JWT_SECRET:mChatSecretKeyForJwtAuthenticationSuperSecureKey2026!}
    expiration-ms: 604800000 # 7 days
  storage:
    upload-dir: uploads
  cors:
    allowed-origins: "http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173"
  whatsapp:
    verify-token: ${WHATSAPP_VERIFY_TOKEN:aether_meta_verify_token_2026}
