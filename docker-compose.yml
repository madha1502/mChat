version: '3.8'

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: mchat-java-server
    ports:
      - "5000:5000"
      - "5001:5001"
    environment:
      - SERVER_PORT=5000
      - SOCKETIO_PORT=5001
      - JWT_SECRET=mChatSuperSecretJwtKey2026ProductionEnvironment!
      - WHATSAPP_VERIFY_TOKEN=aether_meta_verify_token_2026
    volumes:
      - mchat-uploads:/app/uploads
      - mchat-data:/app/data
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: mchat-react-client
    ports:
      - "5173:80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  mchat-uploads:
  mchat-data:
