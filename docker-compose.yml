version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: aether-mongodb
    restart: always
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: aether_messenger

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: aether-server
    restart: always
    ports:
      - '5000:5000'
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/aether_messenger
      - CLIENT_URL=http://localhost:5173
      - JWT_SECRET=aether_super_secret_production_jwt_key_at_least_32_characters
      - ENCRYPTION_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      - WHATSAPP_VERIFY_TOKEN=aether_meta_verify_token_2026
    depends_on:
      - mongodb
    volumes:
      - aether_uploads:/app/uploads

volumes:
  mongodb_data:
  aether_uploads:
